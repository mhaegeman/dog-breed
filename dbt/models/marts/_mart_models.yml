version: 2

models:
  - name: dim_breed
    description: "Breed dimension with weight class and family-friendly flag"
    columns:
      - name: breed_id
        description: "Primary key — unique breed identifier"
        tests:
          - unique
          - not_null

      - name: breed_name
        description: "Official breed name"
        tests:
          - not_null

      - name: weight_class
        description: "Size classification: Toy, Small, Medium, Large, Giant, or Unknown"
        tests:
          - accepted_values:
              values: ['Toy', 'Small', 'Medium', 'Large', 'Giant', 'Unknown']

  - name: fact_weight_life_span
    description: "Numeric weight, height, and life-span measurements per breed"
    columns:
      - name: breed_id
        description: "Foreign key to dim_breed"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_breed')
              field: breed_id
